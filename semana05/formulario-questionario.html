<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/formulario-questionario.css">
    <title>Questionario HTML e CSS</title>
</head>

<body>

    <header>
        <h1>Questionario HTML e CSS</h1>
    </header>
    <main>
        <form action="">
            <label for="q1">1. O que significa a sigla CSS?</label>
            <input type="text" name="q1" id="q1">

            <label for="q2">2. Como os atributos "id" e "class" são selecionados no CSS?</label>
            <textarea name="q2" id="q2" rows="4"></textarea>

            <label for="q3">3. Qual das opções abaixo é um comentário CSS válido?</label>
            <select name="q3" id="q3">
                <option value="">-- Selecione --</option>
                <option value="option01">// Este é um comentário</option>
                <option value="option02">/* Este é um comentário */</option>
                <option value="option03">## Este é um comentário</option>
            </select>

            <label for="q4">4. Qual é a margem inferior dada por essa declaração?</label>
            <pre><code>margin: 10px 5px 15px;</code></pre>
            <input type="number" name="q4" id="q4">

            <button type="submit">Enviar questionário</button>
        </form>
    </main>



</body>

</html>
