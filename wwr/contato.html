<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco - Correiras Rafting</title>
    <meta name="description"
        content="Entre em contato com a Corredeiras Rafting. Endereço, telefone, e-mail e formulário de contato. Estamos prontos para atender você!">
    <meta name="author" content="Igor Augusto Mota Gonçalves">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <img src="imagens/logo_rafting.png" alt="logo do site de rafting">
        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>
    <main>
        <div class="contato-info">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <p>Cachoeira de Cima, 83370-000</p>
            <p>Antonina, Paraná</p>
            <p>+55 41 99999-9999</p>
            <p>info@corredeiras.com</p>
        </div>

        <div class="contato-principal">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2252.416707369357!2d-48.75024995362033!3d-25.247496457991556!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-PT!2sbr!4v1780710393799!5m2!1spt-PT!2sbr"
                width="600" height="450" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>

            <form action="">
                <div class="formulario">
                    <div class="item-formulario coluna2">
                        <label for="nome-completo">Nome completo</label>
                        <input type="text" id="nome-completo" name="nome-completo" placeholder="Digite aqui..."
                            required>
                    </div>
                    <div class="item-formulario coluna2">
                        <label for="email-usuario">E-mail</label>
                        <input type="email" name="email-usuario" id="email-usuario" placeholder="Digite aqui..."
                            required>
                    </div>
                    <div class="item-formulario">
                        <label>Propósito da Mensagem</label>
                        <fieldset>
                            <label><input type="radio" name="proposito" value="duvida"> Dúvida Geral</label>
                            <label><input type="radio" name="proposito" value="reserva"> Pergunta sobre Reserva</label>
                            <label><input type="radio" name="proposito" value="sugestao"> Sugestão</label>
                        </fieldset>
                    </div>

                    <div class="item-formulario">
                        <label for="mensagem">Mensagem</label>
                        <textarea name="mensagem" id="mensagem" rows="5" placeholder="Digite aqui..."></textarea>
                    </div>
                    <div>
                        <input type="checkbox" name="box" id="box">
                        <label for="box">Por favor, me inscreva na newsletter mensal</label>
                    </div>

                    <button type="submit">Entrar em contato!</button>
                </div>
        </div>

        <section class="aventura funcionarios">
            <h2>Estamos Aqui para Servi-lo</h2>
            <figure>
                <img src="imagens/rafael.webp" alt="Rafael, Guia Chefe de Rafting">
                <figcaption>Rafael - Guia Chefe de Rafting</figcaption>
            </figure>
            <figure>
                <img src="imagens/antonio.webp" alt="Antônio, Coordenador de Segurança">
                <figcaption>Antônio - Coordenador de Segurança</figcaption>
            </figure>
            <figure>
                <img src="imagens/marcela.webp" alt="Marcela, Instrutora de Rafting">
                <figcaption>Marcela - Instrutora de Rafting</figcaption>
            </figure>
        </section>
        </form>

    </main>
    <footer>
        <p>©️2026 - Corredeiras Rafting - Igor Mota </p>
        <nav class="redes-sociais">
            <a href="https://facebook.com"><img src="imagens/facebook.png" alt="logo facebook"></a>
            <a href="https://linkedin.com"><img src="imagens/linkedin.png" alt="Logo LinkedIn"></a>
            <a href="https://instagram.com"><img src="imagens/instagram.png" alt="Logo Instagram"></a>
        </nav>

    </footer>
</body>

</html>
