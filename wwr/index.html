<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial - Corredeiras Rafting</title>
    <meta name="description" content="Corredeiras Rafting - Aventura nas corredeiras do Paraná. Passeios para todos os níveis. Venha viver essa experiência!">
    <meta name="author" content="Igor Augusto Mota Gonçalves">
    <link rel="stylesheet" href="estilos/rafting.css">
    <link rel="icon" href="imagens/logo_rafting.webp">
</head>

<body>
    <header>
        <img src="imagens/logo_rafting.webp" alt="logo do site de rafting">
        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="imagens/rafting_index.webp" alt="botes na corredeira">
            <h1>Corredeiras Rafting</h1>

        </div>

        <section class="cta">
            <img src="imagens/index2.webp" alt="aventura nas corredeiras">
            <div>
                <h2>Pronto para a aventura?</h2>
                <p>Conheça nossos passeios e escolha o ideal para você!</p>
                <a href="passeios.html">Ver Passeios</a>
            </div>
            <img src="imagens/index3.webp" alt="clientes felizes nas corredeiras">
        </section>

        <section class="newsletter">
            <h2>Receba nossas novidades!</h2>
            <p>Inscreva-se e fique por dentro das nossas promoções e novidades.</p>
            <form>
                <label for="nome-newsletter">Nome</label>
                <input type="text" id="nome-newsletter" name="nome-newsletter" placeholder="Seu nome" required>
                <label for="email-newsletter">E-mail</label>
                <input type="email" id="email-newsletter" name="email-newsletter" placeholder="Seu e-mail" required>
                <button type="submit">Inscrever-se</button>
            </form>
        </section>

    </main>
    <footer>
        <p>©️2026 - Corredeiras Rafting - Igor Mota </p>
        <nav class="redes-sociais">
            <a href="https://facebook.com"><img src="imagens/facebook.webp" alt="logo facebook"></a>
            <a href="https://linkedin.com"><img src="imagens/linkedin.webp" alt="Logo LinkedIn"></a>
            <a href="https://instagram.com"><img src="imagens/instagram.webp" alt="Logo Instagram"></a>
        </nav>

    </footer>
</body>

</html>
